services:
  apigateway:
    build:
      context: ./server/api-gateway
      dockerfile: ./app.dockerfile
    depends_on:
      - authservice
      - shopservice
      - menuservice
      - tableservice
      - sessionservice
      - orderservice
      - paymentservice
      - historyservice
    ports:
      - 8000:8080
    environment:
      PORT: "8080"
      AUTH_CLIENT: authservice:8080
      SHOP_CLIENT: shopservice:8080
      MENU_CLIENT: menuservice:8080
      TABLE_CLIENT: tableservice:8080
      SESSION_CLIENT: sessionservice:8080
      ORDER_CLIENT: orderservice:8080
      PAYMENT_CLIENT: paymentservice:8080
      HISTORY_CLIENT: historyservice:8080
    restart: on-failure
  rabbitmqservice:
    build:
      context: ./server/services/rabbitmq
      dockerfile: ./app.dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: on-failure
  redis:
    image: redis:8.2.1-alpine
    container_name: redis
    restart: unless-stopped
  websocketservice:
    build:
      context: ./server/services/ws
      dockerfile: ./app.dockerfile
    environment:
      PORT: "8080"
    ports:
      - "8081:8080"
    restart: on-failure
  authservice:
    build:
      context: ./server/services/auth
      dockerfile: ./app.dockerfile
    environment:
      PORT: "8080"
      DB_URL: "postgresql://postgres.qwjlqyuxcadqwvmarwlo:Barista@2025@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres"
      SHOP_CLIENT: shopservice:8080
      MENU_CLIENT: menuservice:8080
    restart: on-failure
  shopservice:
    build:
      context: ./server/services/shop
      dockerfile: ./app.dockerfile
    environment:
      PORT: "8080"
      DB_URL: "postgresql://postgres.qwjlqyuxcadqwvmarwlo:Barista@2025@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres"
    restart: on-failure
  menuservice:
    build:
      context: ./server/services/menu
      dockerfile: ./app.dockerfile
    environment:
      PORT: "8080"
      DB_URL: "postgresql://postgres.qwjlqyuxcadqwvmarwlo:Barista@2025@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres"
      CLOUDINARY_URL: "cloudinary://759689914359316:HrHhR6oR09cGl2Ele49DeAql8k8@dw71avwb7"
      CLOUDINARY_API_KEY: "759689914359316"
      CLOUDINARY_API_SECRET: "HrHhR6oR09cGl2Ele49DeAql8k8"
      CLOUDINARY_CLOUD_NAME: "dw71avwb7"
