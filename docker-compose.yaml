services:
  user_db:
    build:
      context: ./server/services/auth
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  menu_db:
    build:
      context: ./server/services/menu
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  order_db:
    build:
      context: ./server/services/order
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  payment_db:
    build:
      context: ./server/services/payment
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  session_db:
    build:
      context: ./server/services/session
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: session
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  shop_db:
    build:
      context: ./server/services/shop
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  table_db:
    build:
      context: ./server/services/table
      dockerfile: ./db.dockerfile
    environment:
      POSTGRES_DB: table
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 7866
    restart: unless-stopped
  apigateway:
    build:
      context: ./server/api-gateway
      dockerfile: ./app.dockerfile
    depends_on:
      - authservice
      - shopservice
      - menuservice
      - tableservice
      - sessionservice
      - orderservice
      - paymentservice
    ports:
      - 8000:8080
    environment:
      PORT: "8080"
      AUTH_CLIENT: authservice:8080
      SHOP_CLIENT: shopservice:8080
      MENU_CLIENT: menuservice:8080
      TABLE_CLIENT: tableservice:8080
      SESSION_CLIENT: sessionservice:8080
      ORDER_CLIENT: orderservice:8080
      PAYMENT_CLIENT: paymentservice:8080
    restart: on-failure
  rabbitmqservice:
    build:
      context: ./server/services/rabbitmq
      dockerfile: ./app.dockerfile
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: on-failure
  redis:
    image: redis:8.2.1-alpine
    container_name: redis
    restart: unless-stopped
  authservice:
    build:
      context: ./server/services/auth
      dockerfile: ./app.dockerfile
    depends_on:
      - user_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@user_db:5432/user?sslmode=disable"
    restart: on-failure
  shopservice:
    build:
      context: ./server/services/shop
      dockerfile: ./app.dockerfile
    depends_on:
      - shop_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@shop_db:5432/shop?sslmode=disable"
    restart: on-failure
  menuservice:
    build:
      context: ./server/services/menu
      dockerfile: ./app.dockerfile
    depends_on:
      - menu_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@menu_db:5432/menu?sslmode=disable"
    restart: on-failure
  tableservice:
    build:
      context: ./server/services/table
      dockerfile: ./app.dockerfile
    depends_on:
      - table_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@table_db:5432/table?sslmode=disable"
      RMQHost: rabbitmqservice:5672
    restart: on-failure
  qrgenservice:
    build:
      context: ./server/services/qrgen
      dockerfile: ./app.dockerfile
    depends_on:
      - rabbitmqservice
    environment:
      RMQHost: rabbitmqservice:5672
    restart: on-failure
  sessionservice:
    build:
      context: ./server/services/session
      dockerfile: ./app.dockerfile
    depends_on:
      - session_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@session_db:5432/session?sslmode=disable"
      REDIS_URL: redis:6379
    restart: on-failure
  orderservice:
    build:
      context: ./server/services/order
      dockerfile: ./app.dockerfile
    depends_on:
      - order_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@order_db:5432/order?sslmode=disable"
    restart: on-failure
  paymentservice:
    build:
      context: ./server/services/payment
      dockerfile: ./app.dockerfile
    depends_on:
      - payment_db
    environment:
      PORT: "8080"
      DB_URL: "postgres://admin:7866@payment_db:5432/payment?sslmode=disable"
    restart: on-failure
